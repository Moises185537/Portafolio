<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Operaciones con Java Script</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			color: #333;
			text-align: center;
			padding: 50px;
		}
		form {
			background: #fff;
			padding: 20px;
			border-radius: 5px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		input[type="text"] {
			padding: 10px;
			margin: 10px 0;
			border: 1px solid #ccc;
			border-radius: 5px;
			width: 80%;
		}
		input[type="button"] {
			background-color: #28a745;
			color: white;
			border: none;
			padding: 10px 15px;
			margin: 5px;
			border-radius: 5px;
			cursor: pointer;
		}
		input[type="button"]:hover {
			background-color: #218838;
		}
		#resultado {
			font-size: 1.5em;
			margin-top: 20px;
			color: #007bff;
		}
	</style>
	<script type="text/javascript">
		function sumar(){
			var n1=document.getElementById("num1").value;
			var n2=document.getElementById("num2").value;
			var r=parseInt(n1)+parseInt(n2);
			document.getElementById("resultado").innerHTML=r;
		}
		function restar(){
			var n1=document.getElementById("num1").value;
			var n2=document.getElementById("num2").value;
			var r=parseInt(n1)-parseInt(n2);
			document.getElementById("resultado").innerHTML=r;
		}
		function dividir(){
			var n1=document.getElementById("num1").value;
			var n2=document.getElementById("num2").value;
			var r=parseInt(n1)/parseInt(n2);
			document.getElementById("resultado").innerHTML=r;
		}
		function multi(){
			var n1=document.getElementById("num1").value;
			var n2=document.getElementById("num2").value;
			var r=parseInt(n1)*parseInt(n2);
			document.getElementById("resultado").innerHTML=r;
		}
	</script>
</head>
<body>
	<form>
		<label for="num1">Numero:</label>
		<input type="text" name="num1" id="num1" placeholder="Numero 1"><br/>
		<label for="num2">Numero:</label>
		<input type="text" name="num2" id="num2" placeholder="Numero 2"><br/>
		<input type="button" name="suma" id="suma" value="Suma" onclick="sumar()">
		<input type="button" name="resta" id="resta" value="Resta" onclick="restar()">
		<input type="button" name="mult" id="mult" value="Multiplica" onclick="multi()">
		<input type="button" name="divide" id="divide" value="Divide" onclick="dividir()">
		El resultado es:
		<p id="resultado" name="resultado"></p>
	</form>
</body>
</html>
