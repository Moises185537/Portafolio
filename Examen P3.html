<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Estilos.css">
    <title>Calculadora de Propinas</title>
    <script type="javascript"> 

    </script>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Propinas</h1>
        <label for="subtotal">Subtotal:</label>
        <input type="number" id="subtotal" placeholder="Ingrese el subtotal" required>
        
        <label for="porcentaje">Porcentaje de propina:</label>
        <input type="number" id="porcentaje" placeholder="Ingrese el porcentaje" required>
        
        <button id="calcular">Calcular</button>
        
        <h2>Resultados</h2>
        <p id="propina">Propina: $0.00</p>
        <p id="total">Total a pagar: $0.00</p>
    </div>
    <script src="Java P3.js"></script>
</body>
</html>
