<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lectura desde Formulario</title>
	<script type="text/javascript">
		function leer() {
			var user = document.getElementById("user").value;
			var pass = document.getElementById("pass").value;
			var carrera = document.getElementById("carrera").value;
			var genero = document.querySelector('input[name="genero"]:checked').value;

			document.getElementById("resultado").innerHTML = 
				"Nombre: " + user + "<br/>" +
				"Contraseña: " + pass + "<br/>" +
				"Carrera: " + carrera + "<br/>" +
				"Género: " + (genero === 'f' ? 'Femenino' : 'Masculino');
		}
	</script>
</head>
<body>
	<h1>Registro de usuario</h1>
	<form name="formulario">
		<label for="user">Nombre:</label>
		<input type="text" name="user" id="user"><br/>
		<label for="pass">Contraseña:</label>
		<input type="password" name="pass" id="pass"><br/>
		<label for="carrera">Carrera:</label>
		<select name="carrera" id="carrera">
			<option value="ITI">IT Informacion</option>
			<option value="ITEM">Ing Telematica</option>
		</select><br/>
		<input type="radio" name="genero" id="genero_f" value="f">
		<label for="genero_f">Femenino</label><br/><br/>
		<input type="radio" name="genero" id="genero_m" value="m">
		<label for="genero_m">Masculino</label><br/>
		<input type="button" name="envio" id="envio" value="Enviar" onclick="leer()">
	</form>
	<h2>Tus datos son:</h2>
	<div id="resultado"></div>
</body>
</html>
